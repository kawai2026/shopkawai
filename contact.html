<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ - ショップカワイ本店</title>
<link rel="stylesheet" href="common.css">
<style>
.contact-wrap{max-width:620px;margin:0 auto;padding:28px 20px 40px}
.contact-wrap h1{font-size:20px;font-weight:600;margin-bottom:10px;padding-bottom:12px;border-bottom:1px solid #e8e8e4}
.contact-note{font-size:13px;color:#888;margin-bottom:22px;line-height:1.7}
.contact-form-card{background:#fff;border:1px solid #e8e8e4;border-radius:12px;padding:20px}
.required-mark{color:#c0392b;font-size:11px;margin-left:4px}
.contact-sent{text-align:center;padding:40px 20px;background:#fff;border:1px solid #e8e8e4;border-radius:12px}
.contact-sent-icon{font-size:36px;margin-bottom:12px}
.contact-sent-title{font-size:17px;font-weight:600;margin-bottom:8px}
.contact-sent-text{font-size:14px;color:#888;line-height:1.7}
</style>
</head>
<body>
<header class="site-header">
  <a href="index.html" class="site-logo">ショップカワイ本店</a>
  <a href="index.html" class="cart-btn">← 商品一覧へ戻る</a>
</header>
<main>
  <div class="contact-wrap">
    <h1>お問い合わせ</h1>
    <p class="contact-note">以下のフォームにご入力のうえ、送信してください。<br>通常2〜3営業日以内にご返答いたします。</p>
    <div class="contact-form-card" id="contact-form-area"></div>
  </div>
</main>
<footer class="site-footer">
  <div class="footer-links">
    <a href="guide.html" class="footer-link">お買い物ガイド</a>
    <a href="legal.html" class="footer-link">特定商取引法に基づく表記</a>
    <a href="privacy.html" class="footer-link">プライバシーポリシー</a>
    <a href="terms.html" class="footer-link">利用規約</a>
    <a href="contact.html" class="footer-link">お問い合わせ</a>
  </div>
  <div class="footer-copy">© SHOP KAWAI All Rights Reserved.</div>
</footer>
<script src="shared.js"></script>
<script>
const fields = SK.loadContactFields();
const endpoint = SK.loadContactEmail();
const area = document.getElementById('contact-form-area');

if (!fields.length) {
  area.innerHTML = '<div style="color:#bbb;text-align:center;padding:30px">お問い合わせフォームは現在準備中です。</div>';
} else {
  const formId = 'contact-form';
  const action = endpoint ? `action="${endpoint}"` : '';
  area.innerHTML = `
    <form id="${formId}" method="POST" ${action}>
      ${fields.map(f => {
        const req = f.required ? 'required' : '';
        const reqMark = f.required ? '<span class="required-mark">必須</span>' : '';
        let input = '';
        if (f.type === 'textarea') {
          input = `<textarea class="form-textarea" name="${f.label}" id="cf-${f.id}" ${req} placeholder="${f.label}を入力してください"></textarea>`;
        } else {
          input = `<input class="form-input" type="${f.type}" name="${f.label}" id="cf-${f.id}" ${req} placeholder="${f.label}を入力してください">`;
        }
        return `<div class="form-group"><label class="form-label" for="cf-${f.id}">${f.label}${reqMark}</label>${input}</div>`;
      }).join('')}
      <button type="submit" class="submit-btn">送信する</button>
    </form>`;

  document.getElementById(formId).addEventListener('submit', function(e) {
    if (!endpoint) {
      e.preventDefault();
      area.innerHTML = `
        <div class="contact-sent">
          <div class="contact-sent-icon">✓</div>
          <div class="contact-sent-title">お問い合わせを受け付けました</div>
          <div class="contact-sent-text">ご連絡いただきありがとうございます。<br>2〜3営業日以内にご返答いたします。</div>
        </div>`;
    }
    // endpoint が設定されている場合はFormspreeなどに通常送信される
  });
}
</script>
</body>
</html>
